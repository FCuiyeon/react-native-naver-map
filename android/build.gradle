apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&
         rootProject.getProperty("newArchEnabled") == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  namespace "com.mjstudio.reactnativenavermap"

  compileSdk = 36

  defaultConfig {
    minSdk = 24
    targetSdk = 36
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]

      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib"

  // ✅ ext 제거, 버전 명시 (배포용 라이브러리 기준)
  implementation "com.naver.maps:map-sdk:3.19.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src")
    libraryName = "RNCNaverMap"
    codegenJavaPackageName = "com.mjstudio.reactnativenavermap"
  }
}
